<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realizer • Image to Video</title><style>body{font:15px system-ui;background:#080a10;color:#eee;max-width:900px;margin:auto;padding:18px}.card{border:1px solid #303646;border-radius:14px;padding:18px;margin:12px 0}.drop{border:2px dashed #475569;border-radius:12px;padding:35px;text-align:center}.drop.dragging{outline:3px solid #8b5cf6}img{max-width:100%;max-height:360px;border-radius:10px;margin-top:12px}textarea,input,select,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:9px}button{cursor:pointer;background:#8b5cf6;color:white;border:0}.ok{color:#22c55e}.err{color:#ef4444}</style><h1>Realizer V1</h1><p>Image → Video browser test</p><div class="card"><div id="drop" class="drop">Drop an image here<br><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" hidden></div><p id="image">No image selected.</p></div><div class="card"><label>Motion prompt</label><textarea id="prompt" placeholder="Slow cinematic camera movement while the subject naturally moves..."></textarea><label>Negative prompt</label><textarea id="negative" placeholder="flicker, blur, distortion..."></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="duration"><option value="3">3 sec</option><option value="5" selected>5 sec</option><option value="10">10 sec</option></select><select id="fps"><option>16</option><option selected>24</option><option>30</option></select></div><button id="submit">Prepare Image-to-Video Request</button><p id="result"></p></div><script type="module">import{validateImage,previewImage}from'./image-to-video.js';const $=x=>document.getElementById(x);let file=null;$('file').onchange=()=>{try{file=validateImage($('file').files[0]);previewImage(file,$('preview'));$('image').textContent=`✓ ${file.name} — ${Math.round(file.size/1024)} KB`;$('image').className='ok'}catch(e){file=null;$('image').textContent=e.message;$('image').className='err'}};$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('dragging')};$('drop').ondragleave=()=>$('drop').classList.remove('dragging');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('dragging');const dt=e.dataTransfer.files;if(dt.length){$('file').files=dt;$('file').dispatchEvent(new Event('change'))}};$('submit').onclick=()=>{try{if(!file)throw Error('Choose an image first.');if(!$('prompt').value.trim())throw Error('Enter a motion prompt.');$('result').textContent='✓ Browser validation passed. Ready to send to the configured backend.';$('result').className='ok'}catch(e){$('result').textContent='✗ '+e.message;$('result').className='err'}};</script></html>
