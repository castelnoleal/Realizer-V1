<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Realizer V1 — Free AI Video</title><style>body{margin:0;background:#07080c;color:#f4f6fb;font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#10131a;border:1px solid #272c38;border-radius:16px;padding:20px;margin:14px 0}textarea,input,button{font:inherit;width:100%;box-sizing:border-box;border-radius:10px;padding:12px;background:#151923;color:#fff;border:1px solid #303646;margin-top:8px}button{cursor:pointer;background:#8b5cf6;border-color:#8b5cf6;font-weight:700}button:disabled{opacity:.55}.tabs{display:flex;gap:8px}.tabs button{background:#151923}.tabs button.active{background:#8b5cf6}.status{padding:10px;border-radius:10px;background:#151923;margin-top:12px}.ok{color:#22c55e}.err{color:#ef4444}.warn{color:#f59e0b}.preview{width:100%;border-radius:12px;margin-top:14px}.drop{border:2px dashed #475569;padding:25px;text-align:center;border-radius:12px;margin-top:8px}.drop img{max-width:100%;max-height:300px;margin-top:12px;border-radius:10px}.muted{color:#9299aa}@media(max-width:600px){.wrap{padding:12px}}</style></head><body><main class="wrap"><h1>Realizer V1</h1><p class="muted">Browser → open video model → temporary free GPU</p><div class="card"><div class="tabs"><button id="t2v" class="active">Text → Video</button><button id="i2v">Image → Video</button></div><label>Prompt</label><textarea id="prompt" rows="5" placeholder="A cinematic drone shot over a futuristic coastal city at sunset, realistic lighting, smooth camera movement"></textarea><div id="imageBox" style="display:none"><label>Reference image</label><div class="drop"><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><div id="imagePreview"></div></div></div><label>Duration: <span id="durText">3</span> seconds</label><input id="duration" type="range" min="1" max="3" value="3"><button id="generate">🎬 Generate Video</button><div id="status" class="status">Ready.</div><div id="result"></div></div><div class="card"><b>Engine</b><p class="muted">Pyramid Flow on Hugging Face ZeroGPU. The public Space supports Text → Video and optional Image → Video through its <code>/generate_video</code> endpoint.</p><p id="diag" class="muted">Checking connection…</p></div></main><script type="module">import{Client,handle_file}from'https://esm.sh/@gradio/client@1.20.0';const SPACE='Pyramid-Flow/pyramid-flow', $=id=>document.getElementById(id);let mode='t2v',file=null;function setStatus(t,c=''){const e=$('status');e.textContent=t;e.className='status '+c}$('t2v').onclick=()=>{mode='t2v';$('t2v').classList.add('active');$('i2v').classList.remove('active');$('imageBox').style.display='none';setStatus('Ready for text-to-video.')};$('i2v').onclick=()=>{mode='i2v';$('i2v').classList.add('active');$('t2v').classList.remove('active');$('imageBox').style.display='block';setStatus('Choose an image and enter a motion prompt.')};$('duration').oninput=()=>$('durText').textContent=$('duration').value;$('image').onchange=e=>{file=e.target.files[0]||null;$('imagePreview').innerHTML=file?'<img src="'+URL.createObjectURL(file)+'" alt="Reference">':''};async function connect(){return Client.connect(SPACE)}$('generate').onclick=async()=>{const prompt=$('prompt').value.trim();if(!prompt)return setStatus('Enter a prompt first.','err');if(mode==='i2v'&&!file)return setStatus('Choose a reference image first.','err');const b=$('generate');b.disabled=true;$('result').innerHTML='';setStatus('Connecting to the free GPU…','warn');try{const app=await connect();setStatus('Queued. Generating on Hugging Face ZeroGPU…','warn');const image=mode==='i2v'?await handle_file(file):null;const duration=Number($('duration').value);/* IMPORTANT: current Space signature is prompt,image,duration,guidance,video_guidance,fps. */const job=app.submit('/generate_video',[prompt,image,duration,9,5,8]);job.on('status',s=>{if(s?.stage==='error')setStatus('GPU error: '+(s.message||'Generation failed.'),'err');else if(s?.stage==='queue')setStatus('GPU queue position: '+(s.position??'waiting')+'…','warn');else if(s?.stage==='generating')setStatus('GPU is generating the video…','warn')});const result=await job.result();const data=result?.data;let out=Array.isArray(data)?data[data.length-1]:data;let url=out?.url||out?.video?.url||(typeof out==='string'&&/^https?:/i.test(out)?out:null);if(!url)throw new Error('Generation returned no video file.');$('result').innerHTML='<video class="preview" controls playsinline src="'+url+'"></video><p><a target="_blank" rel="noopener" href="'+url+'">Open generated video</a></p>';setStatus('Generation completed successfully.','ok')}catch(e){console.error(e);setStatus('Generation failed: '+(e?.message||String(e)),'err');$('result').innerHTML='<p class="muted">The temporary public GPU may be unavailable or rate-limited. The exact API call is now corrected for the current Pyramid Flow Space.</p>'}finally{b.disabled=false}};(async()=>{try{await connect();$('diag').textContent='✓ Pyramid Flow API is reachable.'}catch(e){$('diag').textContent='⚠ Could not connect: '+(e?.message||e)}})();</script></body></html>
