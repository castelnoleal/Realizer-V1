<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realizer Free Engine Test</title>
<style>body{margin:0;background:#08090d;color:#f4f6fb;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(900px,94vw)}.card{background:#11151d;border:1px solid #293140;border-radius:18px;padding:22px}textarea,input,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #303848;background:#171c25;color:#fff}button{cursor:pointer;background:#7c3aed;border-color:#7c3aed;font-weight:700}.tabs{display:flex;gap:8px}.tabs button{background:#171c25}.tabs button.active{background:#7c3aed}.drop{border:2px dashed #3b4352;border-radius:12px;padding:25px;text-align:center;margin:10px 0}.drop.drag{border-color:#a78bfa}.preview{max-width:100%;max-height:280px;border-radius:12px}.status{padding:10px;border-radius:10px;background:#0d1118;color:#aeb7c7;white-space:pre-wrap}.ok{color:#86efac}.err{color:#fca5a5}video{width:100%;border-radius:12px;margin-top:14px}</style>
</head><body><main class="wrap"><div class="card"><h1>Realizer V1 — Free Engine Test</h1><p>Browser → Hugging Face ZeroGPU → open video model. No Realizer API key is required for this test.</p><div class="tabs"><button id="t2v" class="active">Text → Video</button><button id="i2v">Image → Video</button></div><textarea id="prompt" placeholder="Describe the video..."></textarea><div id="drop" class="drop" style="display:none">Drop an image here or <input id="file" type="file" accept="image/*"><img id="preview" class="preview" style="display:none"></div><div><label>Duration <input id="duration" type="number" min="1" max="10" step="1" value="3"></label></div><button id="generate">Generate with Realizer Free</button><div id="status" class="status">Ready.</div><video id="video" controls style="display:none"></video><p><small>Engine: Pyramid Flow on Hugging Face ZeroGPU. The model/code is MIT-licensed; ZeroGPU availability can be rate-limited or queued.</small></p></div></main>
<script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client@2.5.1/dist/index.min.js";
const $=id=>document.getElementById(id); let mode='t2v', file=null;
$('t2v').onclick=()=>{mode='t2v';$('t2v').classList.add('active');$('i2v').classList.remove('active');$('drop').style.display='none'};
$('i2v').onclick=()=>{mode='i2v';$('i2v').classList.add('active');$('t2v').classList.remove('active');$('drop').style.display='block'};
$('file').onchange=()=>{file=$('file').files[0];if(file){$('preview').src=URL.createObjectURL(file);$('preview').style.display='block'}};
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');file=e.dataTransfer.files[0];$('preview').src=URL.createObjectURL(file);$('preview').style.display='block'};
function status(s,cls=''){ $('status').textContent=s;$('status').className='status '+cls }
function findVideo(x){if(!x)return null;if(typeof x==='string'&&(/\.mp4|\.webm|\.mov|\.m3u8|https?:/i.test(x)))return x;if(x.url)return x.url;if(x.path&&/^https?:/i.test(x.path))return x.path;if(Array.isArray(x)){for(const y of x){const z=findVideo(y);if(z)return z}}if(x.data)return findVideo(x.data);return null}
$('generate').onclick=async()=>{const prompt=$('prompt').value.trim();if(!prompt)return status('Enter a prompt first.','err');if(mode==='i2v'&&!file)return status('Upload an image first.','err');$('generate').disabled=true;try{status('Connecting to the free GPU engine…');const app=await Client.connect('Pyramid-Flow/pyramid-flow');status('Submitting generation job…');const image=mode==='i2v'?handle_file(file):null;const seconds=Math.max(1,Math.min(10,Number($('duration').value)||3));const job=app.submit('/generate_video',[prompt,image,seconds,9,5,8]);for await(const msg of job){if(msg.type==='status'&&msg.stage)status('GPU: '+msg.stage+(msg.message?'\n'+msg.message:''));if(msg.type==='data'){const url=findVideo(msg.data);if(url){$('video').src=url;$('video').style.display='block';status('Generation complete.','ok')}}}if($('video').style.display==='none'){const result=await app.predict('/generate_video',[prompt,image,seconds,9,5,8]);const url=findVideo(result);if(!url)throw new Error('The engine returned no video URL.');$('video').src=url;$('video').style.display='block'}status('Generation complete.','ok')}catch(e){console.error(e);status('Generation failed:\n'+(e?.message||e),'err')}finally{$('generate').disabled=false}}
</script></body></html>
