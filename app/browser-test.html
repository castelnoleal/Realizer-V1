<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realizer Browser Test</title><style>body{font:16px system-ui;max-width:760px;margin:30px auto;padding:16px;background:#080a10;color:#eee}section{border:1px solid #303646;border-radius:12px;padding:16px;margin:12px 0}input,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border-radius:8px}button{cursor:pointer}.drop{border:2px dashed #475569;padding:30px;text-align:center}.drop.dragging{outline:3px solid #8b5cf6}img{max-width:100%;max-height:320px;border-radius:10px;margin-top:10px}.pass{color:#22c55e}.fail{color:#ef4444}</style><h1>Realizer V1 Browser Test</h1><section><b>1. UI runtime</b><p id="runtime">PASS — JavaScript loaded.</p></section><section><b>2. Image upload</b><div id="drop" class="drop">Drop JPG, PNG or WebP here<br>or <input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div><img id="preview" hidden><p id="imageResult">Waiting for image.</p></section><section><b>3. Backend connection</b><input id="endpoint" value="http://127.0.0.1:8000"><button id="health">Test Backend</button><pre id="healthResult">Not tested.</pre></section><section><b>4. Generation contract</b><textarea id="prompt" placeholder="Test prompt"></textarea><button id="validate">Validate Request</button><p id="contract"></p></section><script type="module">import{validateImage,bindImageUpload}from'./image-upload.js';import{validateGenerationInput,MODES}from'./generation-contract.js';const $=x=>document.getElementById(x);bindImageUpload({input:$('file'),dropZone:$('drop'),preview:$('preview'),onChange:(f,e)=>$('imageResult').innerHTML=e?`<span class="fail">FAIL — ${e.message}</span>`:f?`<span class="pass">PASS — ${f.name} (${Math.round(f.size/1024)} KB)</span>`:'Waiting for image.'});$('health').onclick=async()=>{try{let r=await fetch($('endpoint').value.replace(/\/$/,'')+'/api/health');let d=await r.json();$('healthResult').textContent=JSON.stringify(d,null,2);$('healthResult').className=r.ok?'pass':'fail'}catch(e){$('healthResult').textContent='FAIL — '+e.message;$('healthResult').className='fail'}};$('validate').onclick=()=>{try{validateGenerationInput({mode:$('file').files[0]?MODES.IMAGE_TO_VIDEO:MODES.TEXT_TO_VIDEO,prompt:$('prompt').value,image:$('file').files[0]});$('contract').textContent='PASS — generation request is valid.';$('contract').className='pass'}catch(e){$('contract').textContent='FAIL — '+e.message;$('contract').className='fail'}};</script>
